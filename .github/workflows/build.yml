name: Build & Auto-Sync APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "INSTALLATION/**"
      - "README.md"
      - "version.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java & JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          cordova create build-app com.lossrun.flashcards "Flashcards"
          cd build-app
          cp -r ../index.html ../style.css ../app.js ../icon.png www/
          cordova platform add android
          cordova build android --release || cordova build android

      - name: Package & Replace Installation Zip
        run: |
          mkdir -p INSTALLATION
          # Locate the output apk
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            rm -f INSTALLATION/Flashcard-Reader-apk.zip
            zip -j INSTALLATION/Flashcard-Reader-apk.zip "$APK_PATH"
          else
            echo "No APK found, skipping packaging"
            exit 1
          fi

      - name: Commit & Push New APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add INSTALLATION/Flashcard-Reader-apk.zip
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Flashcard-Reader-apk.zip [skip ci]" && git push origin main)
